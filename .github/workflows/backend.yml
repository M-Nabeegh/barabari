name: Backend

on:
  pull_request:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  sql-tests:
    name: Database rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema and run row level security checks
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -c "create database barabari"
          psql -v ON_ERROR_STOP=1 -q -d barabari -f supabase/tests/00_supabase_stub.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -d barabari -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -q -d barabari -f supabase/tests/10_rls_and_sync_rules.sql 2>&1 | grep -E "NOTICE|PASSED"
